# Run everything: docker compose up --build   (needs a .env file next to this one, see .env.docker.example)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: motors_usa
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/db/views.sql:/docker-entrypoint-initdb.d/02-views.sql:ro
      - ./backend/db/seed.sql:/docker-entrypoint-initdb.d/03-seed.sql:ro
    ports:
      - "127.0.0.1:5433:5432"   # only this PC can connect (psql / Power BI), never the internet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d motors_usa"]
      interval: 5s
      retries: 10
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: "4000"
      PGSSL: "false"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/motors_usa
      FRONTEND_URL: ${SITE_URL:-http://localhost:3100}
    depends_on:
      db: { condition: service_healthy }
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:3100}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:4000
    ports:
      - "3100:3100"
    depends_on:
      - backend
volumes:
  dbdata:
